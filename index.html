<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إنترنتنا القديم 2008</title>
<meta name="description" content="The internet we grew up with — ادخل الإنترنت كأنك في 2008">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Concept: you sit at a 2008 PC. Dial-up, a hill-and-sky wallpaper, icons down the right edge, and every "website" does something to you. */
:root{
  --sky1:#2f7fdc; --sky2:#a9d4ff; --hill1:#5dae3b; --hill2:#2f7a1f;
  --t1:#2a6fdb; --t2:#0b3fa8; --win:#ece9d8; --ink:#1a1a1a; --muted:#4f4f4f;
  --link:#0033cc; --hot:#a83a0f; --ok:#2c7a20; --bad:#b00000;
  --font:"Tajawal",Tahoma,Arial,sans-serif;
  --vh:100dvh;
}
@supports not (height:100dvh){:root{--vh:100vh}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);overflow:hidden;font-size:15px;
  background:
    radial-gradient(ellipse 120% 55% at 30% 105%,var(--hill1) 0 60%,transparent 61%),
    radial-gradient(ellipse 90% 45% at 90% 110%,#4c9c2e 0 60%,transparent 61%),
    radial-gradient(ellipse 18% 6% at 22% 22%,rgba(255,255,255,.85),transparent 70%),
    radial-gradient(ellipse 14% 5% at 70% 14%,rgba(255,255,255,.7),transparent 70%),
    linear-gradient(var(--sky1),var(--sky2) 70%,var(--hill2));}
button{font-family:inherit}
a{color:var(--link)}
::selection{background:#316ac5;color:#fff}
:focus-visible{outline:2px dotted #000;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* boot */
#boot{position:fixed;inset:0;background:#000;color:#ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;text-align:center;padding:16px}
#boot h1{margin:0;font-size:clamp(34px,8vw,60px);color:#fff;font-weight:900}
#boot h1 span{color:#ffb400}
#boot p{margin:0;font-size:18px}
#boot .go{font-size:20px;font-weight:900;padding:12px 30px;border:2px outset #ccc;background:linear-gradient(#fff,#ccc);cursor:pointer;color:#000}
#dial{display:none;flex-direction:column;align-items:center;gap:10px;background:var(--win);color:var(--ink);border:3px solid var(--t2);padding:18px;width:min(360px,100%);border-radius:6px}
#dial .pc{font-size:34px;letter-spacing:6px;direction:ltr}
#dial .pc i{display:inline-block;animation:pulse .6s infinite alternate;font-style:normal}
@keyframes pulse{to{opacity:.2}}
#dial .meter{width:100%;height:16px;border:1px solid #888;background:#fff;padding:2px}
#dial .meter b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#3c9a2e 0 10px,transparent 10px 12px);transition:width 1.4s linear}
#boot small{color:#aaa}

/* desktop: icons run down the right edge, like a real XP desktop in Arabic */
.desktop{height:calc(var(--vh) - 42px);padding:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:88px;gap:6px;align-content:start;justify-content:start}
.icon{background:none;border:0;color:#fff;font-size:13px;line-height:1.3;text-align:center;cursor:pointer;padding:4px;border-radius:3px;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:1px 1px 2px #000,0 0 3px #000}
.icon:hover,.icon:focus-visible{background:rgba(49,106,197,.55);outline:1px dotted #fff}
.icon .g{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;text-shadow:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.45)}

/* windows */
.win{position:fixed;top:12px;left:12px;width:min(840px,calc(100vw - 130px));height:min(640px,calc(var(--vh) - 70px));background:var(--win);border:3px solid var(--t2);border-radius:8px 8px 4px 4px;box-shadow:3px 6px 20px rgba(0,0,0,.5);display:flex;flex-direction:column;z-index:10}
#w-msn{left:auto;right:110px;top:40px;width:min(380px,calc(100vw - 130px));height:min(540px,calc(var(--vh) - 90px))}
#w-player{left:60px;top:50px;width:min(640px,calc(100vw - 130px));height:min(440px,calc(var(--vh) - 110px))}
.win[hidden]{display:none}
.tb{background:linear-gradient(180deg,#4b8af0,var(--t1) 40%,var(--t2));color:#fff;font-weight:700;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:4px 4px 0 0;cursor:move;user-select:none;text-shadow:1px 1px 1px #00246b;touch-action:none}
.tb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb button{width:26px;height:24px;border:1px solid #fff;border-radius:4px;background:linear-gradient(#e86b4a,#c0381a);color:#fff;font-weight:900;cursor:pointer;line-height:1;flex:none}
.shake{animation:shake .5s}
@keyframes shake{20%{translate:-14px 0}40%{translate:14px 0}60%{translate:-10px 0}80%{translate:10px 0}}

/* browser chrome */
.nav{display:flex;gap:5px;align-items:center;padding:4px 8px;background:#f6f5ef;border-bottom:1px solid #b9b6a6;font-size:12px;position:relative}
.nav button{border:1px solid #8a8;background:linear-gradient(#fff,#ddd);border-radius:12px;min-width:30px;height:26px;cursor:pointer;font-size:13px}
.nav button:disabled{opacity:.4;cursor:default}
.nav .menu{border-radius:3px;padding:0 8px}
.nav input{flex:1;min-width:0;border:1px solid #7f9db9;padding:3px 6px;direction:ltr;font-family:Tahoma,var(--font);font-size:12px;height:26px}
.encmenu{position:absolute;top:32px;left:8px;background:#fff;border:1px solid #888;box-shadow:2px 2px 6px rgba(0,0,0,.35);z-index:5;display:grid;min-width:200px}
.encmenu button{border:0;border-radius:0;background:none;text-align:right;padding:6px 12px;height:auto}
.encmenu button:hover{background:#316ac5;color:#fff}
.links{display:flex;gap:2px;padding:3px 8px;background:#f0efe6;border-bottom:1px solid #ccc;font-size:12px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.links button{border:0;background:none;cursor:pointer;color:#0033cc;font-size:12.5px;padding:3px 7px;border-radius:2px}
.links button:hover,.links button.on{background:#dde6f7}
.page{flex:1;overflow:auto;background:#fff;min-height:0;position:relative}
.status{font-size:12px;padding:3px 8px;background:#f6f5ef;border-top:1px solid #b9b6a6;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.loadbar{height:3px;background:linear-gradient(90deg,#3c9a2e,#8f8);width:0;transition:width .7s}

/* shared */
.btn{font-weight:700;font-size:14px;padding:6px 14px;border:2px outset #ccc;background:linear-gradient(#fff,#ddd);cursor:pointer;color:#000;min-height:34px}
.btn:active{border-style:inset}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:13px;color:var(--muted)}
.msg{font-weight:700}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
h2.pt{margin:0 0 4px;font-size:21px}
.center{text-align:center}

/* search home */
.home{display:flex;flex-direction:column;align-items:center;gap:14px;padding:46px 16px}
.logo{font-size:clamp(42px,10vw,68px);font-weight:900;font-family:Georgia,var(--font);line-height:1}
.logo b:nth-child(1){color:#1a5adf}.logo b:nth-child(2){color:#d0201a}.logo b:nth-child(3){color:#c98a00}.logo b:nth-child(4){color:#2e8b33}
.sbox{display:flex;gap:6px;width:min(500px,100%);flex-wrap:wrap;justify-content:center}
.sbox input{flex:1;min-width:200px;padding:7px;font-size:16px;border:1px solid #888;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:540px}
.chips button{border:1px solid #c5d3ea;background:#f3f7ff;color:var(--link);border-radius:14px;padding:4px 12px;cursor:pointer;font-size:13px}
.results{padding:16px 24px;max-width:660px;display:grid;gap:18px}
.res button{all:unset;font-size:17px;cursor:pointer;text-decoration:underline;color:var(--link)}
.res button:focus-visible{outline:2px dotted #000}
.res .u{color:#1a6b1a;font-size:13px;direction:ltr;text-align:right}
.res p{margin:2px 0;font-size:14px}

/* blocked page */
.blocked{min-height:100%;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.blocked .box{border:3px solid #9b1c1c;max-width:520px;text-align:center;padding:24px;display:grid;gap:10px;background:#fff7f7}
.blocked .stop{width:70px;height:70px;margin:0 auto;background:#c0262c;color:#fff;font-weight:900;display:grid;place-items:center;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);font-size:15px}
.blocked h2{margin:0;color:#9b1c1c}

/* forum */
.fhead{background:linear-gradient(#0d3c6e,#195a9e);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.fhead h2{margin:0;font-size:22px}
.marquee{overflow:hidden;white-space:nowrap;background:#000;color:#ffde00;padding:5px 0;font-weight:700}
.marquee b{display:inline-block;padding-inline-start:100%;animation:mq 22s linear infinite}
.marquee:hover b,.marquee:focus-within b,.marquee:focus b{animation-play-state:paused}
@keyframes mq{to{transform:translateX(100%)}}
.online{font-size:12px;padding:6px 12px;background:#f2f6fc;border-bottom:1px solid #cdd9ea}
.fwrap{padding:12px;display:grid;gap:12px}
.post{border:1px solid #9fb6d6;display:grid;grid-template-columns:130px 1fr}
.post .who{background:#e3ecf8;padding:10px;font-size:12px;text-align:center;border-left:1px solid #9fb6d6}
.post .who b{display:block;font-size:14px;color:var(--t2)}
.post .av{width:54px;height:54px;margin:6px auto;border-radius:4px;display:grid;place-items:center;font-size:28px;background:#fff;border:1px solid #aaa}
.post .rank{color:var(--hot);font-weight:700}
.post .txt{padding:10px;line-height:1.8;min-width:0;overflow-wrap:anywhere}
.post .sig{margin-top:10px;padding-top:6px;border-top:1px dashed #aaa;font-size:13px;color:#6a1f8a;text-align:center}
.post .bar{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.flink{all:unset;cursor:pointer;color:#0033cc;text-decoration:underline;font-family:Tahoma,monospace;direction:ltr;display:block;text-align:left;overflow-wrap:anywhere}
.flink:focus-visible{outline:2px dotted #000}
.locked{filter:blur(4px);user-select:none;pointer-events:none}
.blink{animation:bl 1s steps(2) 6;color:var(--bad);font-weight:900}
@keyframes bl{50%{opacity:0}}
.flash{animation:flash 1.2s 2}
@keyframes flash{50%{background:#fff3a0}}
.qr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid #9fb6d6;background:#f2f6fc}

/* rapidshare */
.rs{padding:24px;display:grid;gap:14px;justify-items:center;text-align:center;background:linear-gradient(#fff,#e8f0ff);min-height:100%}
.rs .logo2{font-family:Georgia,serif;font-size:34px;color:#b8262b;font-weight:900;direction:ltr}
.rs .count{font-size:52px;font-weight:900;color:var(--t2);font-variant-numeric:tabular-nums}
.rs .plans{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rs .plan{border:2px solid #9fb6d6;padding:14px;width:200px;background:#fff;display:grid;gap:8px}

/* blog */
.blog{background:#000;color:#7CFC00;min-height:100%;padding:20px;font-family:Tahoma,var(--font)}
.blog h2{color:#ff66cc;margin:0 0 6px;text-align:center}
.blog article{max-width:620px;margin:16px auto;border:1px dashed #7CFC00;padding:14px;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}
.blog .warn{background:#ffffe1;color:#000;border:1px solid #000;padding:8px 10px;font-size:13px;max-width:620px;margin:0 auto}

/* hotmail */
.mail{display:grid;grid-template-columns:minmax(220px,300px) 1fr;min-height:100%}
.mail .side{border-left:1px solid #c5d3ea;background:#f3f7ff;min-width:0}
.mail .hd{background:linear-gradient(#4f86d4,#1f50a3);color:#fff;padding:10px 12px;font-weight:900;font-size:18px}
.mail .item{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 12px;border-bottom:1px solid #dbe4f3;cursor:pointer;font-size:13px}
.mail .item b{display:block;font-size:14px;color:#000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mail .item.unread b::before{content:"● ";color:#1f50a3}
.mail .item:hover,.mail .item.on{background:#dfe9fb}
.mail .item:focus-visible{outline:2px dotted #000}
.mail .read{padding:18px;line-height:1.9;min-width:0;overflow-wrap:anywhere}
.mail .read h3{margin:0 0 4px}
.mail .att{display:inline-flex;gap:6px;align-items:center;border:1px solid #aaa;background:#fafafa;padding:6px 10px;cursor:pointer;margin-top:8px;font-family:inherit;font-size:14px}

/* name decorator */
.zk{padding:16px;display:grid;gap:16px;background:#fdf6ff;min-height:100%}
.zk h2{margin:0;color:#5a1fb0;text-align:center;font-family:"Comic Sans MS","Tajawal",var(--font)}
.zk section{background:#fff;border:2px dashed #b48ae6;padding:12px;display:grid;gap:10px}
.zk h3{margin:0;font-size:17px;color:#3d1580}
.zk .inrow{display:flex;gap:6px;flex-wrap:wrap}
.zk .inrow input{flex:1;min-width:180px;padding:8px;font-size:17px;font-family:inherit;border:1px solid #7f9db9}
.zrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px dotted #d7c3f2;padding:6px 0}
.zrow output{flex:1;min-width:0;font-size:18px;font-weight:700;color:#6a1f8a;overflow-wrap:anywhere;user-select:all}
.zrow .btn{font-size:12px;padding:3px 8px;min-height:30px}
.psmout{font-size:18px;font-style:italic;color:#333;background:#eef4ff;border:1px solid #c5d3ea;padding:10px;border-radius:4px;min-height:48px}
.sigbox{border:1px solid #9fb6d6;background:#fff;padding:12px;text-align:center;color:#6a1f8a;line-height:1.9;font-size:15px}
.drama{height:22px;border:1px solid #888;background:#fff;padding:2px;position:relative}
.drama b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd000,#ff5a00,#c00);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

/* messenger */
.msn{display:flex;flex-direction:column;height:100%;background:linear-gradient(#dbe8fb,#fff);min-height:0}
.msn .me{padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #9fb6d6}
.msn .pic{width:48px;height:48px;border:2px solid #6a9;border-radius:6px;display:grid;place-items:center;font-size:26px;background:#fff;flex:none}
.msn .name{font-weight:900;color:var(--t2)}
.msn .psm{font-size:12px;color:#555;font-style:italic}
.contacts{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid #c5d3ea;background:#f3f7ff}
.contacts button{border:1px solid #c5d3ea;background:#fff;border-radius:12px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.chat{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:#fff;min-height:0}
.chat .l b{color:#6a1f8a}.chat .l.mine b{color:#0b3fa8}
.chat .sys{color:#666;font-size:12px;text-align:center}
.chat .nudge{color:var(--bad);font-weight:700;text-align:center}
.typing{font-size:12px;color:#666;padding:0 10px;min-height:18px}
.msnbar{display:flex;gap:6px;padding:8px;border-top:1px solid #9fb6d6;flex-wrap:wrap}
.msnbar input{flex:1;min-width:120px;padding:6px;border:1px solid #7f9db9;font-family:inherit;font-size:14px}

/* games */
.games{padding:16px;display:grid;gap:14px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.gtabs button.on{border-style:inset;background:#cde}
.snakewrap{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}
.nokia{background:#9db88a;border:10px solid #333;border-radius:14px;padding:8px;width:min(300px,100%);display:flex;flex-direction:column;gap:6px;position:relative}
.nokia canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#9db88a;display:block}
.nokia .sc{font-family:Tahoma,monospace;color:#1c2b12;display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.nokia .ov{position:absolute;inset:38px 8px 8px;display:grid;place-items:center;text-align:center;color:#1c2b12;font-weight:900;background:rgba(157,184,138,.85);font-size:16px;line-height:1.7}
.pad{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;touch-action:manipulation}
.pad button{height:50px;border-radius:12px;border:2px outset #aaa;background:#ddd;font-size:18px;cursor:pointer}
.arena{position:relative;height:340px;border:2px inset #ccc;background:#3a6ea5;overflow:hidden}
.arena .intro{color:#fff;padding:20px;line-height:2}
.pop{position:absolute;width:min(190px,62%);background:var(--win);border:2px solid var(--t2);box-shadow:2px 3px 6px rgba(0,0,0,.6);font-size:13px}
.pop .pt{background:linear-gradient(#4b8af0,var(--t2));color:#fff;padding:3px 4px 3px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pop .pt button{background:#c0381a;color:#fff;border:1px solid #fff;cursor:pointer;width:32px;height:28px;line-height:1;padding:0;font-size:16px;border-radius:3px}
.pop .pb{padding:8px;text-align:center;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;width:100%}
.mem button{aspect-ratio:1;font-size:30px;border:2px outset #ccc;background:linear-gradient(#3f86ee,#1546b8);cursor:pointer;color:transparent}
.mem button.open{background:#fff;color:inherit;border-style:inset}

/* keek */
.kk{background:#111;color:#fff;height:100%;display:flex;flex-direction:column}
.kk header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;border-bottom:1px solid #333}
.kk header b{font-size:22px;color:#4ad94a;font-family:Georgia,var(--font)}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;min-height:0;display:flex;flex-direction:column;align-items:center;background:#000}
.clip{scroll-snap-align:start;flex:none;height:100%;min-height:420px;width:min(100%,380px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clip::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
.clip .scene{font-size:84px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.clip .cap{position:absolute;bottom:64px;right:14px;left:68px;font-size:16px;font-weight:700;line-height:1.6;z-index:1;text-shadow:0 1px 2px #000}
.clip .user{position:absolute;bottom:36px;right:14px;font-size:13px;z-index:1;color:#eee}
.clip .side{position:absolute;left:10px;bottom:56px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:2}
.clip .side button{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer}
.clip .side span{font-size:12px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.clip .timer{position:absolute;top:10px;right:12px;font-size:12px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums;z-index:1}
.clip .timer .rec{color:#ff6b6b}
.cmts{position:absolute;inset:auto 0 0;background:#1d1d1d;z-index:3;max-height:62%;display:flex;flex-direction:column;border-top:1px solid #444}
.cmts .list{overflow:auto;padding:10px;display:grid;gap:6px;font-size:14px}
.cmts form{display:flex;gap:6px;padding:8px;border-top:1px solid #333}
.cmts input{flex:1;min-width:0;padding:6px;font-family:inherit;font-size:14px}

/* memes */
.memes{padding:16px;display:grid;gap:18px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rage{border:2px solid #000;background:#fff;font-family:"Comic Sans MS","Tajawal",var(--font)}
.rage .p{padding:10px;border-bottom:2px solid #000;min-height:74px;display:flex;align-items:center;gap:10px;font-size:14px}
.rage .p:last-child{border-bottom:0}
.rage .face{font-size:36px}
.vid{border:1px solid #ccc;background:#f8f8f8;display:flex;flex-direction:column;min-width:0}
.vid .th{all:unset;cursor:pointer;height:130px;display:block;position:relative;background:#222 center/cover no-repeat}

<script>
/* ========= ضعي هنا رابط Google Apps Script بعد النشر ========= */
const GUESTBOOK_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
/* ============================================================ */

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const k in attrs){ if(k==="on") for(const ev in attrs.on) e.addEventListener(ev,attrs.on[ev]); else if(k==="text") e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } kids.forEach(c=>c!=null&&e.append(c)); return e; };
const rand = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => Number(n).toLocaleString("ar-SA");
const wait = ms => new Promise(r=>setTimeout(r,ms));
const isMobile = () => innerWidth<=640;
function localGet(k){ try{ return localStorage.getItem(k);}catch(e){return null;} }
function localSet(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }
function sessGet(k){ try{ return sessionStorage.getItem(k);}catch(e){return null;} }
function sessSet(k,v){ try{ sessionStorage.setItem(k,v);}catch(e){} }
const S={popups:0,nudges:0,replies:0,searches:0,videos:0,bt:0,snake:0,ads:0,names:0};
let myName=sessGet("myname")||"أنا";

/* ---------- sound ---------- */
let AC=null, muted=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,d,type="square",vol=.05,when=0){ if(muted) return; try{ const c=ac(),o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination); const t=c.currentTime+when; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02);}catch(e){} }
function noise(d,when,vol=.04){ if(muted) return; try{ const c=ac(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=Math.random()*2-1; const s=c.createBufferSource(),g=c.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g); g.connect(c.destination); s.start(c.currentTime+when);}catch(e){} }
function dialup(){
  [697,1209,770,1336,852,1477,941,1209,697,1336].forEach((f,i)=>tone(f,.09,"sine",.06,i*.11));
  tone(2100,.9,"sine",.04,1.3); tone(1300,.5,"sawtooth",.03,2.3); tone(2400,.4,"square",.02,2.9);
  noise(1.4,3.3,.05); tone(1800,.6,"sawtooth",.025,4.8); noise(.8,5.4,.03);
}
function melody(notes,type="square",vol=.05){ let t=0; notes.forEach(([f,d])=>{ if(f) tone(f,d*.9,type,vol,t); t+=d; }); return t; }
const NOKIA=[[659,.12],[587,.12],[370,.24],[415,.24],[554,.12],[494,.12],[294,.24],[330,.24],[494,.12],[440,.12],[277,.24],[330,.24],[440,.5]];
const sfx={
  boot:()=>melody([[523,.18],[659,.18],[784,.18],[1047,.5]],"triangle",.06),
  msg:()=>{tone(880,.1,"sine",.06);tone(1320,.15,"sine",.06,.1);},
  nudge:()=>{for(let i=0;i<6;i++) tone(i%2?200:260,.07,"square",.06,i*.07);},
  pop:()=>tone(600,.08,"square",.04),
  win:()=>melody([[523,.12],[659,.12],[784,.12],[1047,.3]]),
  lose:()=>melody([[400,.2],[300,.2],[200,.4]]),
  click:()=>tone(1000,.03,"square",.03),
  off:()=>melody([[784,.2],[659,.2],[523,.2],[392,.5]],"triangle",.06),
  drum:()=>{ melody([[220,.1],[0,.05],[220,.1],[0,.05],[330,.35]],"square",.05); }
};
$("#mute").onclick=()=>{ muted=!muted; $("#mute").textContent=muted?"🔇":"🔊"; $("#mute").setAttribute("aria-label",muted?"تشغيل الصوت":"كتم الصوت"); };

/* ---------- boot ---------- */
$("#go").onclick=async()=>{
  $("#go").hidden=true; $("#dial").style.display="flex"; $("#dial").tabIndex=-1; $("#dial").focus(); dialup();
  const steps=[["جاري الاتصال…",25],["التحقق من اسم المستخدم وكلمة المرور…",55],["تسجيل الدخول للشبكة…",85],["متصل! 56.0 كيلوبت/ثانية",100]];
  for(const [t,p] of steps){ $("#dial-t").textContent=t; $("#dial-m").style.width=p+"%"; await wait(1600); }
  $("#boot").remove(); sfx.boot();
  openApp("browser");
  setTimeout(()=>toast("ماسنجر","نوري سجّل دخوله ✌ اضغط هنا تكلمه",()=>openApp("msn")),3000);

    if(bbBusy) return; bbBusy=true; chat.innerHTML=""; const st=el("span",{text:"✓"}); chat.append(el("div",{},"أنا: هلا ",st)); sfx.click();

/* ---------- guestbook ---------- */
const configured=GUESTBOOK_URL.startsWith("https://");
PAGES.guest=(p)=>{
  const st=el("div",{class:"msg",role:"status"});
  const nm=el("input",{id:"gb-name",maxlength:"40",placeholder:"مثلاً: ~*عاشقة الذكريات*~",autocomplete:"nickname",value:myName==="أنا"?"":myName});
  const ms=el("textarea",{id:"gb-msg",maxlength:"500",placeholder:"وش أكثر شي تذكره من إنترنت زمان؟"});
  const hp=el("input",{id:"gb-hp",tabindex:"-1",autocomplete:"off","aria-hidden":"true",class:"sr"});
  const btn=el("button",{class:"btn",type:"submit",text:"أرسل التوقيع ✍"});
  const list=el("div",{class:"entries",role:"feed"},el("p",{class:"note",text:"جاري تحميل التواقيع…"}));
  const form=el("form",{novalidate:""},el("label",{for:"gb-name",text:"الاسم المستعار"}),nm,el("label",{for:"gb-msg",text:"رسالتك"}),ms,hp,btn,st);
  let visits=+sessGet("visitno"); if(!visits){ visits=(+localGet("visits")||0)+1; localSet("visits",visits); sessSet("visitno",visits); }
  p.append(el("div",{class:"gb"},el("h2",{text:"✿ سجل الزوار ✿"}),el("div",{class:"counter"},"أنت الزائر رقم ",el("span",{text:String(1337+visits).padStart(6,"0")})),form,
    configured?null:el("p",{class:"note center",text:"(وضع التجربة: التواقيع تنحفظ على جهازك بس، لين يتفعّل السجل)"}),list));
  const renderList=data=>{ list.innerHTML=""; if(!data.length) list.append(el("p",{class:"note center",text:"ما أحد وقّع للحين. كن أول واحد! 🌹"}));
    data.forEach(e=>list.append(el("article",{class:"entry"},el("div",{class:"h"},el("b",{text:e.name}),el("span",{text:new Date(e.time).toLocaleDateString("ar-SA")})),el("div",{class:"m",text:e.message})))); };
  const localList=()=>{ try{ return JSON.parse(localGet("gb")||"[]"); }catch(e){ return []; } };
  const load=async()=>{
    if(!configured){ renderList(localList()); return; }
    try{ renderList(await (await fetch(GUESTBOOK_URL)).json()); }
    catch(err){ list.innerHTML=""; list.append(el("p",{class:"note",text:"تعذّر تحميل التواقيع."}),el("button",{class:"btn",text:"🔁 حاول مرة ثانية",on:{click:load}})); }
  };
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const name=nm.value.trim(), message=ms.value.trim();
    if(!name){ st.className="msg err"; st.textContent="اكتب اسمك المستعار أول 🙂 (أو زخرفه من «مزخرف الأسماء»)"; nm.focus(); return; }
    if(!message){ st.className="msg err"; st.textContent="اكتب رسالة قبل لا ترسل ✍"; ms.focus(); return; }
    if(!configured){ const l=localList(); l.unshift({name,message,time:new Date().toISOString()}); localSet("gb",JSON.stringify(l.slice(0,50))); st.className="msg ok"; st.textContent="تم! توقيعك صار في السجل 🌹"; ms.value=""; renderList(l); return; }
    btn.disabled=true; st.className="msg"; st.textContent="جاري الإرسال…";
    try{ const out=await (await fetch(GUESTBOOK_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name,message,hp:hp.value})})).json();
      if(!out.ok) throw 0; st.className="msg ok"; st.textContent="تم! توقيعك صار في السجل 🌹"; ms.value=""; toast("سجل الزوار",name+" وقّع في السجل"); load();
    }catch(err){ st.className="msg err"; st.textContent="ما وصل التوقيع. رسالتك ما زالت مكتوبة، تأكد من الإنترنت واضغط إرسال مرة ثانية."; }
    btn.disabled=false;
  });
  load();
};

go("home");
